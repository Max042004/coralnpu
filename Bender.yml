package:
  name: coralnpu

# Third-party RTL is vendored (and patched) into vendor/ with `bender vendor`.
# Vendored packages carry their own upstream Bender.yml (where one exists),
# so these are plain path dependencies.
dependencies:
  common_cells: { path: vendor/common_cells }
  fpu_div_sqrt_mvp: { path: vendor/fpu_div_sqrt_mvp }
  cvfpu: { path: vendor/cvfpu }

# Upstream cvfpu references git revisions of common_cells/fpu_div_sqrt_mvp;
# force everything onto the pinned, vendored copies.
overrides:
  common_cells: { path: vendor/common_cells }
  fpu_div_sqrt_mvp: { path: vendor/fpu_div_sqrt_mvp }

vendor_package:
  - name: common_cells
    target_dir: vendor/common_cells
    upstream:
      git: "https://github.com/pulp-platform/common_cells.git"
      rev: 6aeee85d0a34fedc06c14f04fd6363c9f7b4eeea
  - name: fpu_div_sqrt_mvp
    target_dir: vendor/fpu_div_sqrt_mvp
    upstream:
      git: "https://github.com/pulp-platform/fpu_div_sqrt_mvp.git"
      rev: 86e1f558b3c95e91577c41b2fc452c86b04e85ac
  - name: cvfpu
    target_dir: vendor/cvfpu
    upstream:
      git: "https://github.com/openhwgroup/cvfpu.git"
      rev: bb65bdedd07711dfd41c621382f940a5cbb93046
    patch_dir: vendor/patches/cvfpu
  # Scala (not RTL) sources: rocket-chip's AsyncQueue and what it needs.
  # Compiled by the `asyncqueue` sbt subproject.
  - name: rocket_chip
    target_dir: vendor/rocket_chip
    upstream:
      git: "https://github.com/chipsalliance/rocket-chip.git"
      rev: f517abbf41abb65cea37421d3559f9739efd00a9
    include_from_upstream:
      - src/main/scala/util/AsyncQueue.scala
      - src/main/scala/util/AsyncResetReg.scala
      - src/main/scala/util/Counters.scala
      - src/main/scala/util/Crossing.scala
      - src/main/scala/util/ShiftReg.scala
      - src/main/scala/util/SynchronizerReg.scala
      - src/main/scala/util/package.scala
      - LICENSE.SiFive
      - LICENSE.Berkeley
  - name: diplomacy
    target_dir: vendor/diplomacy
    upstream:
      git: "https://github.com/chipsalliance/diplomacy.git"
      rev: 6590276fa4dac315ae7c7c01371b954c5687a473
    include_from_upstream:
      - diplomacy/src/diplomacy/nodes/HeterogeneousBag.scala
  # FreeRTOS kernel (firmware only; CoralNPU config lives in third_party/freertos/config).
  - name: freertos
    target_dir: vendor/freertos
    upstream:
      git: "https://github.com/FreeRTOS/FreeRTOS-Kernel.git"
      rev: dbf70559b27d39c1fdb68dfb9a32140b6a6777a0  # V11.1.0
    include_from_upstream:
      - croutine.c
      - event_groups.c
      - list.c
      - queue.c
      - stream_buffer.c
      - tasks.c
      - timers.c
      - include
      - portable/GCC/RISC-V
      - portable/MemMang/heap_4.c
      - LICENSE.md
  # TensorFlow Lite Micro and its header/source dependencies (firmware only).
  # The Bazel-only patches (visibility, pthread link flags) are not needed here.
  - name: tflite_micro
    target_dir: vendor/tflite_micro
    upstream:
      git: "https://github.com/tensorflow/tflite-micro.git"
      rev: b75c6ff4e2270047f2b48fa01f833c8101c31f43
    include_from_upstream:
      - tensorflow/lite
      - tensorflow/compiler/mlir/lite
      - signal
      - LICENSE
    exclude_from_upstream:
      - tensorflow/lite/python
      - tensorflow/lite/micro/integration_tests
      - tensorflow/lite/micro/docs
  - name: flatbuffers
    target_dir: vendor/flatbuffers
    upstream:
      git: "https://github.com/google/flatbuffers.git"
      rev: 0100f6a5779831fa7a651e4b67ef389a8752bd9b  # v23.5.26
    include_from_upstream:
      - include
      - LICENSE
  - name: gemmlowp
    target_dir: vendor/gemmlowp
    upstream:
      git: "https://github.com/google/gemmlowp.git"
      rev: fda83bdc38b118cc6b56753bd540caa49e570745
    include_from_upstream:
      - fixedpoint
      - internal
      - public
      - profiling
      - LICENSE
  - name: ruy
    target_dir: vendor/ruy
    upstream:
      git: "https://github.com/google/ruy.git"
      rev: 54774a7a2cf85963777289193629d4bd42de4a59
    include_from_upstream:
      - ruy
      - LICENSE
  - name: kissfft
    target_dir: vendor/kissfft
    upstream:
      git: "https://github.com/mborgerding/kissfft.git"
      rev: 918336beac80868ad3011cb283063bb224e3e5da  # v130
    patch_dir: vendor/patches/kissfft
  # RISC-V ISA tests; `env/` is a submodule upstream and lives in
  # third_party/riscv-tests/env (CoralNPU-specific).
  - name: riscv-tests
    target_dir: vendor/riscv-tests
    upstream:
      git: "https://github.com/riscv-software-src/riscv-tests.git"
      rev: fd4e6cdd033d9075632be9dd207c848181ca474c
    patch_dir: vendor/patches/riscv-tests
    include_from_upstream:
      - isa
      - LICENSE
  # RVVI reflects tag 20240403.0 (before its update).
  - name: RVVI
    target_dir: vendor/RVVI
    upstream:
      git: "https://github.com/riscv-verification/RVVI.git"
      rev: 5786f0d39b84f3fd15ef75b792bdea4281941afe
    patch_dir: vendor/patches/RVVI

sources:
  # Hand-written RTL that the Chisel designs instantiate as BlackBoxes.
  - hdl/verilog/ClockGate.sv
  - hdl/verilog/RstSync.sv
  - hdl/verilog/Sram.v

  # RVVI trace interface (simulation only).
  - target: rvvi
    files:
      - vendor/RVVI/source/host/rvvi/rvviTrace.sv
