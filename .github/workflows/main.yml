name: CoralNPU RTL Build
on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "*"
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ssh-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
      - name: Install tools (Bender, sbt, firtool)
        run: |
          # Only the RTL generation toolchain is needed here; see utils/setup_vm.sh.
          bash utils/setup_vm.sh apt bender sbt firtool
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: build
        run: make rtl DESIGN=RvvCoreMiniAxi
      - uses: actions/upload-artifact@v4
        with:
          name: RvvCoreMiniAxi
          path: |
            ${{ github.workspace }}/build/rtl/RvvCoreMiniAxi/RvvCoreMiniAxi.sv
            ${{ github.workspace }}/build/rtl/RvvCoreMiniAxi/RvvCoreMiniAxi.zip
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            ${{ github.workspace }}/build/rtl/RvvCoreMiniAxi/RvvCoreMiniAxi.sv
            ${{ github.workspace }}/build/rtl/RvvCoreMiniAxi/RvvCoreMiniAxi.zip
